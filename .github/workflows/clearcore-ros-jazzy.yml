# ClearCoreROS Jazzy
#
# Builds the ROS 2 packages and runs simulated-host tests.
# A green job does not mean physical homing or fault recovery was exercised.
# See docs/VALIDATION.md.

name: clearcore-ros-jazzy

on:
  push:
    paths-ignore:
      - "logs/**"
  pull_request:
    paths-ignore:
      - "logs/**"
  workflow_dispatch:

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          . /opt/ros/jazzy/setup.sh
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep python3-pytest git
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -y --rosdistro jazzy

      - name: colcon build
        working-directory: ros2_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --event-handlers console_direct+

      - name: Automated tests
        run: |
          . /opt/ros/jazzy/setup.sh
          python3 host/run_ci_tests.py
          . ros2_ws/install/setup.sh
          cd ros2_ws
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: CI summary
        if: always()
        run: |
          {
            echo "## ClearCoreROS Jazzy CI"
            echo
            echo "Result label: **automated with simulated hardware**."
            echo
            echo "This job installs Jazzy dependencies, builds \`clearcore_bridge\` and \`clearcore_hardware\`, and runs simulated-host tests."
            echo "It does **not** home motors, drop a live Ethernet session to a ClearCore, or recover a physical watchdog."
            echo
            echo "Hardware bench rows live in \`docs/VALIDATION.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
